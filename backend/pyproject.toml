[project]
name = "legal-backend"
version = "0.1.0"
description = "Backend for the Legal Management Module."
requires-python = ">=3.12,<3.14"
dependencies = [
    "celery>=5.4,<6.0",
    "channels>=4.1,<5.0",
    "channels-redis>=4.2,<5.0",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.7,<5.0",
    "django-filter>=24.3,<26.0",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "drf-spectacular>=0.27,<1.0",
    "minio>=7.2,<8.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.0,<7.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3,<4.0",
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "ruff>=0.8,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["common/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
