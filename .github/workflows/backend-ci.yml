name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.11.6"

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Validate documentation
        run: python scripts/validate_docs.py

      - name: Run simplicity scanner
        run: python scripts/check_simplicity.py backend

      - name: Check backend formatting
        working-directory: backend
        run: uv run ruff format --check .

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .

      - name: Run backend tests
        working-directory: backend
        run: uv run python -m pytest -q

      - name: Check migration drift
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          mkdir -p ../build
          uv run python manage.py spectacular --file ../build/openapi.yaml --validate

      - name: Run production deploy checks
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-secret-key-with-more-than-fifty-characters-for-deploy-checks
          DJANGO_ALLOWED_HOSTS: api.example.test
          DJANGO_CORS_ALLOWED_ORIGINS: https://app.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.example.test
          DATABASE_URL: postgresql://legal_management:legal_management@postgres:5432/legal_management
          REDIS_URL: redis://redis:6379/0
          CHANNEL_LAYER_REDIS_URL: redis://redis:6379/1
          CELERY_BROKER_URL: amqp://legal_management:legal_management@rabbitmq:5672//
          CELERY_RESULT_BACKEND: redis://redis:6379/2
          MINIO_ENDPOINT: minio:9000
          MINIO_ACCESS_KEY: ci-minio-access-key
          MINIO_SECRET_KEY: ci-minio-secret-key
          MINIO_BUCKET_DOCUMENTS: legal-documents
        run: uv run python manage.py check --deploy
