asyncapi: 2.6.0
info:
  title: Legal Management User Events
  version: 1.0.0
  description: Minimal contract for server-to-client user events. PostgreSQL/REST remain authoritative.
servers:
  production:
    url: wss://{host}/ws/v1/events/
    protocol: wss
    description: Connect with a one-time ticket query parameter issued by authenticated REST.
    variables:
      host:
        default: example.invalid
channels:
  /ws/v1/events/:
    parameters:
      ticket:
        description: One-time Redis-backed WebSocket ticket. Do not log this value.
        schema:
          type: string
    subscribe:
      message:
        oneOf:
          - $ref: '#/components/messages/UploadStatusChanged'
          - $ref: '#/components/messages/NotificationCreated'
          - $ref: '#/components/messages/DeadlineReminderCreated'
          - $ref: '#/components/messages/OffboardingStatusChanged'
components:
  schemas:
    EventBase:
      type: object
      required: [event_id, event_type, version, occurred_at, data]
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        version:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
  messages:
    UploadStatusChanged:
      name: document.upload.status_changed
      payload:
        allOf:
          - $ref: '#/components/schemas/EventBase'
          - type: object
            properties:
              event_type:
                const: document.upload.status_changed
              data:
                type: object
                required: [document_id, status]
                properties:
                  document_id:
                    type: string
                    format: uuid
                  upload_id:
                    type: string
                    format: uuid
                    description: Compatibility alias for document_id.
                  status:
                    type: string
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
    NotificationCreated:
      name: notification.created
      payload:
        allOf:
          - $ref: '#/components/schemas/EventBase'
          - type: object
            properties:
              event_type:
                const: notification.created
              data:
                type: object
                required: [notification_id]
                properties:
                  notification_id:
                    type: string
                    format: uuid
    DeadlineReminderCreated:
      name: deadline.reminder.created
      payload:
        allOf:
          - $ref: '#/components/schemas/EventBase'
          - type: object
            properties:
              event_type:
                const: deadline.reminder.created
              data:
                type: object
                required: [deadline_id]
                properties:
                  deadline_id:
                    type: string
                    format: uuid
    OffboardingStatusChanged:
      name: offboarding.status_changed
      payload:
        allOf:
          - $ref: '#/components/schemas/EventBase'
          - type: object
            properties:
              event_type:
                const: offboarding.status_changed
              data:
                type: object
                required: [run_id, status]
                properties:
                  run_id:
                    type: string
                    format: uuid
                  status:
                    type: string
